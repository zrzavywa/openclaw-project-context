name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime
        run: node --version
      - name: Changelog gate
        run: npm run check:changelog
      - name: Test suite
        run: npm test
      - name: Release integrity
        run: npm run release:verify
      - name: Manifest is reproducible
        run: |
          npm run release:manifest
          git diff --exit-code -- release.json
